# pixelboard: redis konfiguracija

bind 0.0.0.0
# dostupan samo unutar compose mreže; port se ne objavljuje na host
protected-mode no

dir /data

# --- trajnost (aof) ---
appendonly yes
# everysec = fsync jednom u sekundi; pri padu mašine gubi se najviše ~1 s poteza
# koji još nisu stigli u cassandru
appendfsync everysec

# --- memorija ---
# noeviction: platno i streamovi ne smeju biti izbačeni iz memorije;
# kad ponestane memorije redis odbija upise umesto da briše
maxmemory-policy noeviction

# --- rdb snapshot ---
# dopuna aof-u (brži restart); retka pravila da ne opterećuju disk
save 900 1
save 300 100
save 60 10000
