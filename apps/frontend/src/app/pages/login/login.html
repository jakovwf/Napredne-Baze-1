<section class="auth-page">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Prijava</h1>

    @if (auth.loading()) {
      <mat-progress-bar mode="indeterminate" />
    }

    @if (auth.error()) {
      <p class="error-banner" role="alert">{{ auth.error() }}</p>
    }

    <mat-form-field appearance="outline">
      <mat-label>Korisničko ime</mat-label>
      <input matInput formControlName="username" autocomplete="username" />
      @if (form.controls.username.hasError('required')) {
        <mat-error>Unesi korisničko ime.</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Lozinka</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.hasError('required')) {
        <mat-error>Unesi lozinku.</mat-error>
      }
    </mat-form-field>

    <button mat-flat-button type="submit" [disabled]="auth.loading()">Prijavi se</button>

    <p class="alt">Nemaš nalog? <a routerLink="/register">Registruj se</a></p>
  </form>
</section>
