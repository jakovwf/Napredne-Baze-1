<div class="palette" role="radiogroup" aria-label="Paleta boja" [class.disabled]="disabled()">
  @for (color of colors(); track $index) {
    <button
      type="button"
      class="swatch"
      role="radio"
      [attr.aria-checked]="$index === selected()"
      [attr.aria-label]="'Boja ' + ($index + 1)"
      [class.selected]="$index === selected()"
      [style.background]="color"
      [disabled]="disabled()"
      (click)="pick($index)"
    ></button>
  }
</div>
